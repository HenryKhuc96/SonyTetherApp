name: SonyTether
options:
  bundleIdPrefix: com.bro
targets:
  SonyTether:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: "Cho phép ứng dụng tự động lưu ảnh chụp từ Sony A7 III vào thư viện Photos."
        NSPhotoLibraryUsageDescription: "Cho phép ứng dụng truy cập thư viện Photos để lưu ảnh."
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bro.sonytether
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SUPPORTED_PLATFORMS: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
