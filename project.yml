name: SonyTetherApp
options:
  bundleIdPrefix: com.sonytether

packages:
  CascableCore:
    url: https://github.com/Cascable/cascablecore-distribution.git
    from: 16.0.0

targets:
  SonyTetherApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: YES
    sources:
      - Sources
    dependencies:
      - package: CascableCore
        product: CascableCore
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: "Cấp quyền để lưu ảnh trực tiếp từ máy ảnh vào Photos."
        NSCameraUsageDescription: "Cấp quyền kết nối với máy ảnh Sony qua cáp USB."
        NSLocalNetworkUsageDescription: "Cấp quyền kết nối với máy ảnh trong mạng nội bộ."
        UISupportedExternalAccessoryProtocols:
          - com.apple.ptp
