name: SonyTetherApp
options:
  bundleIdPrefix: com.sonytether

packages:
  CascableCoreSwift:
    url: https://github.com/Cascable/cascablecore-swift.git
    from: 14.0.0

targets:
  SonyTetherApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0" 
    settings:
      TARGETED_DEVICE_FAMILY: 2
    sources: 
      - Sources
    dependencies:
      - package: CascableCoreSwift
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: "Cấp quyền để lưu ảnh trực tiếp từ máy ảnh vào Photos."
        UISupportedExternalAccessoryProtocols: 
          - com.apple.ptp
