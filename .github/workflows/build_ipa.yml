jobs:
  build:
    runs-on: macos-15 # Đổi từ macos-14 (hoặc macos-latest cũ) sang macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Unsigned App
        run: |
          xcodebuild clean build \
            -project SonyTether.xcodeproj \
            -scheme SonyTether \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
